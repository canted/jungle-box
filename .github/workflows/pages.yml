name: Publish browser demo

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'junglebox.html'
      - 'junglebox.css'
      - 'typography.css'
      - 'instrument.js'
      - 'amen.js'
      - 'breaks.js'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser engine
        run: for test in tests/*.cjs; do node "$test" || exit 1; done
      - uses: actions/configure-pages@v5
      - name: Prepare browser demo
        run: |
          mkdir -p _site
          cp index.html junglebox.html junglebox.css typography.css instrument.js amen.js breaks.js _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
